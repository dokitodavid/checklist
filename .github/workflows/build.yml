name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # traz as tags, usadas para numerar a versão

      # Próxima versão = número de releases já publicadas + 1 (builds que falham não contam)
      - name: Definir versão
        id: versao
        run: echo "numero=$(( $(git tag -l 'v*' | wc -l) + 1 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Pversao=${{ steps.versao.outputs.numero }}
          cp app/build/outputs/apk/release/app-release.apk Checklist.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.numero }}
          name: Checklist v${{ steps.versao.outputs.numero }}
          files: Checklist.apk
