name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Mude para 2 quando quiser começar a 2.0 (a próxima release sai como 2.0, depois 2.1…)
  VERSAO_PRINCIPAL: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # traz as tags, usadas para numerar a versão

      # Nome: VERSAO_PRINCIPAL.N, onde N = releases já publicadas nessa versão principal (1.0, 1.1…)
      # Código: total de releases + 1 (o Android exige um número inteiro que sempre cresce)
      # Builds que falham não geram tag, então não pulam número.
      - name: Definir versão
        id: versao
        run: |
          echo "codigo=$(( $(git tag -l 'v*' | wc -l) + 1 ))" >> "$GITHUB_OUTPUT"
          echo "nome=$VERSAO_PRINCIPAL.$(git tag -l "v$VERSAO_PRINCIPAL.*" | wc -l)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ steps.versao.outputs.codigo }} -PversionName=${{ steps.versao.outputs.nome }}
          cp app/build/outputs/apk/release/app-release.apk Checklist.apk

      # Lista os commits desde a última release (ignora os marcados com [skip ci])
      - name: Notas da versão
        run: |
          anterior=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          intervalo=${anterior:+$anterior..}HEAD
          git log "$intervalo" --no-merges --invert-grep --grep='\[skip ci\]' --pretty='- %s' > notas.md
          cat notas.md

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.nome }}
          name: Checklist ${{ steps.versao.outputs.nome }}
          body_path: notas.md
          files: Checklist.apk
